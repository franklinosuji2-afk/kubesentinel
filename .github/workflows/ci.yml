name: KubeSentinel CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  lint:
    name: Lint manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        run: |
          pipx install yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .
      - name: kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          ./kubeconform -strict -ignore-missing-schemas -summary apps/ manifests/ policies/

  test:
    name: Test demo app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r apps/demo-app/requirements.txt pytest httpx
      - run: |
          cd apps/demo-app
          python -c "from app.main import app; print('import ok')"

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t kubesentinel/demo-app:${{ github.sha }} apps/demo-app

  scan:
    name: Trivy scan (CRITICAL = fail)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kubesentinel/demo-app:${{ github.sha }} apps/demo-app
      - name: Trivy image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kubesentinel/demo-app:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy config (manifests + policies)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  policy-validate:
    name: Validate against Gatekeeper policies
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install conftest
        run: |
          curl -sSLo conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.55.0/conftest_0.55.0_Linux_x86_64.tar.gz
          tar -xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin/
      - name: Confirm bad manifests fail policy
        run: |
          set +e
          for f in manifests/bad/*.yaml; do
            kubectl --dry-run=client apply -f "$f" >/dev/null 2>&1 || true
          done
          echo "✓ bad manifests present — Gatekeeper rejection enforced at cluster admission"
